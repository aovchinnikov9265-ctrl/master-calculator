<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Калькулятор прибыли мастера</title>
  <style>
    :root {
      --bg-color: #fbf9f6;
      --card-bg: #ffffff;
      --text-main: #2c2825;
      --text-muted: #8c827a;
      --accent: #2c6b56;
      --accent-hover: #235544;
      --border: #e6e1da;
      --danger: #c95d53;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
    }

    h1 {
      font-size: 20px;
      margin-top: 0;
      margin-bottom: 20px;
      text-align: center;
      color: var(--text-main);
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 6px;
      color: var(--text-muted);
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 16px;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s;
      background: #faf8f5;
    }

    input:focus {
      border-color: var(--accent);
      background: #fff;
    }

    .result-card {
      margin-top: 24px;
      background: #f4f7f5;
      border-radius: 12px;
      padding: 16px;
      border: 1px solid #d4e2dc;
    }

    .result-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .result-row:last-child {
      margin-bottom: 0;
      font-weight: bold;
      font-size: 16px;
      color: var(--accent);
      border-top: 1px solid #d4e2dc;
      padding-top: 8px;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <script>
    // ==========================================
    // СИСТЕМА ДОСТУПА ПО TELEGRAM ID
    // ==========================================
    const ALLOWED_USERS = [
      197451316, // <-- Ваш реальный Telegram ID
      // 987654321, // <-- Здесь можно добавить ID других мастеров через запятую
    ];

    // Инициализация Telegram WebApp
    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (tg) {
      tg.expand();
    }

    // Получаем ID пользователя
    const userId = tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : null;

    // Блокируем доступ, если ID нет в списке
    if (!userId || !ALLOWED_USERS.includes(userId)) {
      document.open();
      document.write(`
        <!DOCTYPE html>
        <html lang="ru">
        <head>
          <meta charset="UTF-8">
          <title>Доступ ограничен</title>
        </head>
        <body style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #fbf9f6; color: #2c2825; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
          <div style="font-size: 48px; margin-bottom: 16px;">🛡️</div>
          <h2 style="color: #c95d53; margin: 0 0 8px 0; font-size: 20px;">Доступ ограничен</h2>
          <p style="font-size: 14px; color: #8c827a; max-width: 300px; text-align: center; line-height: 1.4; margin: 0 0 20px 0;">Этот инструмент предназначен только для авторизованных мастеров.</p>
          <div style="font-size: 12px; background: rgba(0,0,0,0.05); padding: 8px 12px; border-radius: 8px; color: #555;">Ваш Telegram ID: ${userId || 'не определен'}</div>
        </body>
        </html>
      `);
      document.close();
      throw new Error("Access denied");
    }
  </script>

  <div class="container">
    <h1>Калькулятор прибыли мастера</h1>
    
    <div class="form-group">
      <label for="price">Стоимость услуги (₽)</label>
      <input type="number" id="price" placeholder="0" value="3000" oninput="calculate()">
    </div>

    <div class="form-group">
      <label for="cost">Себестоимость материалов (₽)</label>
      <input type="number" id="cost" placeholder="0" value="500" oninput="calculate()">
    </div>

    <div class="form-group">
      <label for="expenses">Прочие расходы / Налог (₽)</label>
      <input type="number" id="expenses" placeholder="0" value="200" oninput="calculate()">
    </div>

    <div class="result-card">
      <div class="result-row">
        <span>Ваши расходы:</span>
        <span id="totalCost">700 ₽</span>
      </div>
      <div class="result-row">
        <span>Чистая прибыль:</span>
        <span id="netProfit">2,300 ₽</span>
      </div>
    </div>
  </div>

  <script>
    function calculate() {
      const price = parseFloat(document.getElementById('price').value) || 0;
      const cost = parseFloat(document.getElementById('cost').value) || 0;
      const expenses = parseFloat(document.getElementById('expenses').value) || 0;

      const totalCost = cost + expenses;
      const netProfit = price - totalCost;

      document.getElementById('totalCost').innerText = totalCost.toLocaleString('ru-RU') + ' ₽';
      document.getElementById('netProfit').innerText = netProfit.toLocaleString('ru-RU') + ' ₽';
    }

    // Первичный расчет при загрузке
    calculate();
  </script>
</body>
</html>
