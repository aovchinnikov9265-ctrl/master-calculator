<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Калькулятор прибыли мастера</title>
  <style>
    :root {
      --bg-color: #fbf9f6;
      --card-bg: #ffffff;
      --text-main: #2c2825;
      --text-muted: #8c827a;
      --accent: #2c6b56;
      --border: #e6e1da;
      --danger: #c95d53;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
    }

    h1 {
      font-size: 20px;
      margin-top: 0;
      margin-bottom: 20px;
      text-align: center;
      color: var(--text-main);
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 6px;
      color: var(--text-muted);
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 16px;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s;
      background: #faf8f5;
    }

    input:focus {
      border-color: var(--accent);
      background: #fff;
    }

    .result-card {
      margin-top: 24px;
      background: #f4f7f5;
      border-radius: 12px;
      padding: 16px;
      border: 1px solid #d4e2dc;
    }

    .result-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .result-row:last-child {
      margin-bottom: 0;
      font-weight: bold;
      font-size: 16px;
      color: var(--accent);
      border-top: 1px solid #d4e2dc;
      padding-top: 8px;
      margin-top: 8px;
    }
  </style>

  <script>
    // Проверяем секретный ключ в адресной строке (например: ?token=master2026)
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    
    // Секретный токен, который должны знать только вы
    const SECRET_TOKEN = 'master2026';

    if (token !== SECRET_TOKEN) {
      document.addEventListener('DOMContentLoaded', () => {
        document.body.innerHTML = `
          <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #fbf9f6; color: #2c2825; font-family: sans-serif; text-align: center; padding: 20px;">
            <div style="font-size: 48px; margin-bottom: 16px;">🛡️</div>
            <h2 style="color: #c95d53; margin: 0 0 8px 0; font-size: 20px;">Доступ ограничен</h2>
            <p style="font-size: 14px; color: #8c827a; max-width: 300px; line-height: 1.4; margin: 0;">У вас нет прав для просмотра этого калькулятора.</p>
          </div>
        `;
      });
      throw new Error("Unauthorized");
    }
  </script>
</head>
<body>

  <div class="container">
    <h1>Калькулятор прибыли мастера</h1>
    
    <div class="form-group">
      <label for="price">Стоимость услуги (₽)</label>
      <input type="number" id="price" placeholder="0" value="3000" oninput="calculate()">
    </div>

    <div class="form-group">
      <label for="cost">Себестоимость материалов (₽)</label>
      <input type="number" id="cost" placeholder="0" value="500" oninput="calculate()">
    </div>

    <div class="form-group">
      <label for="expenses">Прочие расходы / Налог (₽)</label>
      <input type="number" id="expenses" placeholder="0" value="200" oninput="calculate()">
    </div>

    <div class="result-card">
      <div class="result-row">
        <span>Ваши расходы:</span>
        <span id="totalCost">700 ₽</span>
      </div>
      <div class="result-row">
        <span>Чистая прибыль:</span>
        <span id="netProfit">2,300 ₽</span>
      </div>
    </div>
  </div>

  <script>
    function calculate() {
      const price = parseFloat(document.getElementById('price').value) || 0;
      const cost = parseFloat(document.getElementById('cost').value) || 0;
      const expenses = parseFloat(document.getElementById('expenses').value) || 0;

      const totalCost = cost + expenses;
      const netProfit = price - totalCost;

      document.getElementById('totalCost').innerText = totalCost.toLocaleString('ru-RU') + ' ₽';
      document.getElementById('netProfit').innerText = netProfit.toLocaleString('ru-RU') + ' ₽';
    }

    calculate();
  </script>
</body>
</html>
