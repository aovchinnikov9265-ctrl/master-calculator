<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Калькулятор прибыли мастера</title>
  <style>
    :root {
      --bg-color: #fbf9f6;
      --card-bg: #ffffff;
      --text-main: #2c2825;
      --text-muted: #8c827a;
      --accent: #2c6b56;
      --border: #e6e1da;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
    }

    h1 {
      font-size: 20px;
      margin-top: 0;
      margin-bottom: 20px;
      text-align: center;
      color: var(--text-main);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .label-wrapper {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
    }

    /* Кнопка с восклицательным знаком / i */
    .info-toggle {
      background: none;
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 24px;
      height: 24px;
      font-size: 12px;
      font-weight: bold;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      user-select: none;
    }

    .info-toggle:active {
      background-color: #f0ece6;
      border-color: var(--accent);
      color: var(--accent);
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 16px;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s;
      background: #faf8f5;
    }

    input:focus {
      border-color: var(--accent);
      background: #fff;
    }

    /* Блок с расходниками по умолчанию скрыт через JS или стиль */
    .details-box {
      display: none;
      background: #f9f6f0;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      color: var(--text-muted);
      padding: 10px 12px;
      margin-top: 6px;
    }

    .result-card {
      margin-top: 24px;
      background: #f4f7f5;
      border-radius: 12px;
      padding: 16px;
      border: 1px solid #d4e2dc;
    }

    .result-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .result-row:last-child {
      margin-bottom: 0;
      font-weight: bold;
      font-size: 16px;
      color: var(--accent);
      border-top: 1px solid #d4e2dc;
      padding-top: 8px;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Калькулятор прибыли мастера</h1>
    
    <div class="form-group">
      <label for="price">Стоимость услуги (₽)</label>
      <input type="number" id="price" placeholder="0" value="3000" oninput="calculate()">
    </div>

    <div class="form-group">
      <div class="label-wrapper">
        <label for="cost">Себестоимость материалов (₽)</label>
        <!-- Используем стандартный onclick с прямым вызовом -->
        <button type="button" class="info-toggle" onclick="toggleDetails()" title="Состав расходников">i</button>
      </div>
      <input type="number" id="cost" placeholder="0" value="500" oninput="calculate()">
      
      <!-- Выпадающий блок с содержимым расходников -->
      <div id="consumablesDetails" class="details-box">
        • Перчатки, салфетки: 150 ₽<br>
        • Дезинфекция и крафт-пакеты: 100 ₽<br>
        • Расходные материалы/препараты: 250 ₽
      </div>
    </div>

    <div class="form-group">
      <label for="expenses">Прочие расходы / Налог (₽)</label>
      <input type="number" id="expenses" placeholder="0" value="200" oninput="calculate()">
    </div>

    <div class="result-card">
      <div class="result-row">
        <span>Ваши расходы:</span>
        <span id="totalCost">700 ₽</span>
      </div>
      <div class="result-row">
        <span>Чистая прибыль:</span>
        <span id="netProfit">2,300 ₽</span>
      </div>
    </div>
  </div>

  <script>
    function calculate() {
      const price = parseFloat(document.getElementById('price').value) || 0;
      const cost = parseFloat(document.getElementById('cost').value) || 0;
      const expenses = parseFloat(document.getElementById('expenses').value) || 0;

      const totalCost = cost + expenses;
      const netProfit = price - totalCost;

      document.getElementById('totalCost').innerText = totalCost.toLocaleString('ru-RU') + ' ₽';
      document.getElementById('netProfit').innerText = netProfit.toLocaleString('ru-RU') + ' ₽';
    }

    function toggleDetails() {
      const box = document.getElementById('consumablesDetails');
      // Прямое переключение свойства display в обход классов
      if (box.style.display === 'block') {
        box.style.display = 'none';
      } else {
        box.style.display = 'block';
      }
    }

    calculate();
  </script>
</body>
</html>
